# Security headers for what Nginx serves itself (the app's files). The API sets
# its own with helmet. Nginx drops inherited add_header lines in a block that
# has its own, so every location serving files includes this.
# The real-mode Playwright run serves the app under these same headers
# (client/playwright-support/securityHeaders.mjs), so a page they would break fails there.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;
