# /etc/mongod.conf: one node, a replica set (the app's transactions need one),
# reachable only from this machine, users required.
storage:
  dbPath: /var/lib/mongodb
systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod.log
net:
  port: 27017
  bindIp: 127.0.0.1
processManagement:
  timeZoneInfo: /usr/share/zoneinfo
replication:
  replSetName: rs0
security:
  authorization: enabled
  # Required with users on a replica set, even of one node.
  keyFile: /var/lib/mongodb/rs.key
