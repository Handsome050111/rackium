name: Debug chrome (temporary)
on:
  push:
    branches: ['feature/release-prep']
jobs:
  chrome:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Variants
        run: |
          set +e
          uname -r
          google-chrome-stable --version
          which -a google-chrome-stable
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          sudo useradd --system --create-home --home-dir /opt/rk --shell /bin/bash rk
          sudo chmod 0755 /opt/rk
          ls -ld /opt/rk /tmp /dev/shm
          try() {
            label="$1"; shift
            echo; echo "=== $label"
            timeout 40 "$@" >/tmp/out.txt 2>&1
            code=$?
            echo "exit=$code; output bytes=$(wc -c </tmp/out.txt)"
            grep -vE 'dbus|Vulkan|vaInitialize|gpu_|GPU|DevTools listening' /tmp/out.txt | tail -n 6 | cut -c1-220
          }
          B="/usr/bin/google-chrome-stable --headless --no-sandbox --dump-dom about:blank"
          R="sudo -u rk env HOME=/opt/rk PATH=/usr/bin:/bin:/usr/local/bin"
          try "runner user" $B
          try "rk, plain" $R $B
          try "rk, disable-gpu" $R $B --disable-gpu
          try "rk, no crash reporter" $R $B --disable-crash-reporter --disable-breakpad
          try "rk, XDG dirs" $R XDG_CONFIG_HOME=/opt/rk/.config XDG_CACHE_HOME=/opt/rk/.cache $B
          try "rk, user data dir in tmp" $R $B --user-data-dir=/tmp/rk-profile
          try "rk, disable dev shm" $R $B --disable-dev-shm-usage
          try "rk, sudo -H" sudo -H -u rk $B
          try "rk, login shell" sudo -iu rk $B
          try "rk, headless=new" $R /usr/bin/google-chrome-stable --headless=new --no-sandbox --dump-dom about:blank
          try "rk, real binary" $R /opt/google/chrome/chrome --headless --no-sandbox --dump-dom about:blank
          try "rk, stack trace" $R /usr/bin/google-chrome-stable --headless --no-sandbox --enable-logging=stderr --v=0 --dump-dom about:blank
          echo; ls -la /opt/rk /opt/rk/.config 2>&1 | head -20
          dpkg -l | grep -E 'google-chrome|libnss3 ' | cut -c1-90
          journalctl -k --no-pager -n 15 | cut -c1-200 || true
