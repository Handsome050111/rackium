name: CI

on:
  push:
    branches: [develop]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint (client)
        run: npm run lint

      - name: Unit tests (shared)
        run: npm run test:shared

      - name: Unit tests (client)
        run: npm run test:client

      # Chromium is needed from here on: the server API tests render PDFs
      # with it (documents), then the Playwright suite runs in it. The server's
      # playwright-core and the client's @playwright/test are the same hoisted
      # package, so one browser serves both.
      - name: Get installed Playwright version
        id: playwright-version
        working-directory: client
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # Caches only the browser binary (the slow part, ~100MB+). OS packages
      # (apt) are not meaningfully cacheable on a fresh runner image, so
      # they're reinstalled either way — that part is quick.
      - name: Install Playwright Chromium + OS dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: client
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS dependencies (browser cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: client
        run: npx playwright install-deps chromium

      - name: API tests (server, in-memory replica set)
        run: npm run test:server

      - name: Build (client)
        run: npm run build

      # Mock-mode projects (desktop/iPad/tablet/phone) and the real-mode
      # project (client/e2e-real/, server/e2e/testServer.mjs + an in-memory
      # Mongo replica set) in one run — see playwright.config.js.
      - name: Playwright (mock + real)
        working-directory: client
        run: npx playwright test
